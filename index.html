<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOCK SCREEN -->
    <section id="lockScreen" class="screen">
        <div class="lock-card">

            <div class="logo">daily.</div>

            <p class="subtitle">
                A little place for your thoughts.
            </p>

            <div class="lock-icon">🔒</div>

            <h2>Welcome back</h2>
            <p class="muted">Enter your PIN to continue</p>

            <div class="pin-container">
                <input type="password" maxlength="1" class="pin">
                <input type="password" maxlength="1" class="pin">
                <input type="password" maxlength="1" class="pin">
                <input type="password" maxlength="1" class="pin">
            </div>

            <button id="unlockBtn">Unlock</button>

            <p id="pinError" class="error"></p>

        </div>
    </section>


    <!-- JOURNAL -->
    <main id="journalScreen" class="hidden">

        <header class="topbar">

            <div>
                <div class="brand">daily.</div>
                <div id="todayDate"></div>
            </div>

            <button id="lockBtn" class="lock-btn">
                Lock
            </button>

        </header>


        <section class="journal-container">

            <div class="greeting">
                <p class="small">TODAY</p>

                <h1>
                    How was<br>
                    your day?
                </h1>

                <p class="question">
                    You can tell me anything.
                </p>
            </div>


            <!-- MOOD -->

            <div class="section">

                <p class="label">How are you feeling?</p>

                <div class="moods">

                    <button class="mood" data-mood="happy">
                        <span>😊</span>
                        <small>Happy</small>
                    </button>

                    <button class="mood" data-mood="okay">
                        <span>😐</span>
                        <small>Okay</small>
                    </button>

                    <button class="mood" data-mood="sad">
                        <span>😔</span>
                        <small>Sad</small>
                    </button>

                    <button class="mood" data-mood="angry">
                        <span>😡</span>
                        <small>Angry</small>
                    </button>

                    <button class="mood" data-mood="love">
                        <span>🥹</span>
                        <small>Soft</small>
                    </button>

                </div>

            </div>


            <!-- JOURNAL TEXT -->

            <div class="section">

                <p class="label">Your thoughts</p>

                <textarea
                    id="journalText"
                    placeholder="Tell me about your day..."
                ></textarea>

            </div>


            <!-- SHARING -->

            <div class="share-box">

                <div>
                    <strong>Share this entry?</strong>

                    <p>
                        Keep it private or let your person read it.
                    </p>
                </div>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="shareEntry"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <button id="saveBtn" class="save-btn">
                Save today's entry
            </button>


            <p id="savedMessage" class="saved-message"></p>

        </section>


        <!-- NAVIGATION -->

        <nav class="bottom-nav">

            <button class="nav-item active" data-page="today">
                <span>✎</span>
                <small>Today</small>
            </button>

            <button class="nav-item" data-page="past">
                <span>◷</span>
                <small>Past days</small>
            </button>

            <button class="nav-item" data-page="shared">
                <span>♡</span>
                <small>Shared</small>
            </button>

        </nav>

    </main>


    <script src="script.js"></script>

</body>
</html>
